# =============================================================================
# Xen Hypervisor Uncrustify Configuration
# =============================================================================
# Summary: 4-space indent, Allman braces, space-inside-loop-macros,
#          no vertical alignment for variables/args, but alignment for structs.

# ----- Indentation -----
indent_columns            = 4
indent_label              = 2        # Indent labels at column 2 (Xen style)
indent_with_tabs          = 0        # Xen style uses spaces
input_tab_size            = 4
output_tab_size           = 4
indent_switch_case        = 0        # 'case' aligns with 'switch' keyword

# ----- Bracing (Allman Style) -----
# Braces on new lines for all control structures and functions
nl_if_brace               = add
nl_else_brace             = add
nl_while_brace            = add
nl_for_brace              = add
nl_do_brace               = add
nl_switch_brace           = add
nl_fdef_brace             = add      # Function definitions
nl_fcall_brace            = add      # Function calls (if multi-line)

# Keep 'else' and 'while' (from do-while) on their own lines
nl_brace_else              = add
nl_brace_while             = add
nl_collapse_empty_body     = true    # collapse {} into one line
nl_func_leave_one_liners   = true
nl_after_brace_close       = false
nl_after_vbrace_close      = false
nl_assign_leave_one_liners = true
nl_assign_brace            = remove
nl_end_of_file             = add     # Ensure file ends with a newline

# ----- Parentheses Spacing (The "Xen Special") -----
sp_before_sparen          = add      # space before: if ( ...
sp_inside_sparen          = add      # space inside: ( condition )
sp_after_sparen           = add      # space after: ) {

# Spacing for standard function calls (Standard C style)
sp_func_call_paren        = remove   # No space: func(
sp_inside_fparen          = remove   # No space: (arg)
sp_func_proto_paren       = remove   # No space: void func(int x)

sp_inside_braces          = add      # Space inside init braces: { .field = value }
sp_inside_braces_empty    = renmove  # {} is preferred recently overall
sp_inside_braces_struct   = add      # Space inside struct init braces: { .field = value }

# ----- Pointer / Type Alignment (Xen Style: void *ptr) -----
sp_before_ptr_star        = force    # Force a space before: 'void *'
sp_after_ptr_star         = remove   # No space after: '*ptr'
sp_between_ptr_star       = remove   # Double pointers: '**ptr'
# Treat '*' as part of the name (aligns on '*ptr')
# 2 = align on the star, 1 = align on the type (void *ptr), 0 = no alignment
align_var_def_star_style  = 2

# ----- Macro Mapping (Lexer Hacks) -----
# This forces the listed macros to be treated as 'FOR' loops.
# This allows them to use 'sp_inside_for' instead of 'sp_inside_fparen'.
set FOR for_each_domain
set FOR for_each_vcpu
set FOR for_each_pdev
set FOR list_for_each_entry
set FOR list_for_each_entry_safe

# This rule applies specifically to the macros mapped to 'FOR' above
sp_inside_for             = add      # Result: for_each_domain ( dom )

# ----- Operators -----
sp_before_assign = add
sp_assign                 = add      # a = b
sp_arith                  = add      # a + b
sp_compare                = add      # a == b
sp_bool                   = add      # a && b
sp_addr                   = remove   # &var
sp_deref                  = remove   # *var
sp_member                 = remove   # obj->mem
sp_sign                   = remove   # Unary plus/minus signs: +expr, -expr
sp_return_paren           = add      # return ( expr )
sp_sizeof_paren           = remove   # sizeof(type)

# ----- Line Limits & Comments -----
code_width              = 79
cmt_width               = 79
cmt_reflow_mode         = 0

# Multi-line comment block layout rules
cmt_c_nl_start          = true     # Put a newline after the opening /*
cmt_c_nl_end            = true     # Put a newline before the closing */
cmt_cpp_nl_start        = true     # (Good to include for C++ headers too)
cmt_cpp_nl_end          = true

# Continuation stars and indentation
cmt_star_cont           = true     # Add '*' on continuation lines
cmt_sp_before_star_cont = 0        # Spaces before the star
cmt_sp_after_star_cont  = 1        # Space after the star (* text)
cmt_indent_multi        = true     # Indent the multi-line comment contents

# ----- Miscellaneous -----

# To prevent function arguments from following this same logic:
# Ensure they are governed by their own specific rules:
indent_func_def_param        = false
indent_func_call_param       = false
indent_func_proto_param      = false
#indent_paren_nl             = false    # Don't force newlines after '(' in function calls/defs
#indent_align_paren         = false     # Align parameters vertically if they span multiple lines

# ----- Targeted Macro Continuation -----

# Indent the macro body relative to the #define
indent_macro_brace           = true

# Use this to stop Uncrustify from using indent_continue for everything
indent_continue              = 0

# Ensure the backslash itself is handled consistently
# 1 = align to the right (code_width); 2 = one space after code
align_nl_cont                = 1

# If you want the macro body to be indented even if there are no braces:
# indent_relative_single_line  = false

sp_after_bit_colon           = remove
sp_before_bit_colon          = remove

# sp_before_pp_stringify   = add
# sp_after_pp_stringify    = remove

# ----- Vertical Alignment (Granular Control) -----
# We want to align struct members, but NOT global/local variables or arguments.

align_var_def_span        = 0
        # Disable for global/local vars
align_typedef_span        = 0        # Disable for typedefs (stops zone_t jumping)
align_func_params         = false    # Disable for function parameter lists

# Enable alignment only for struct/union definitions
#align_struct_def_span     = 8        # Align if fields are within 8 lines
align_var_def_gap         = 1        # Minimum gap for alignment

align_var_struct_gap            = 1
align_var_struct_span           = 4
align_var_struct_thresh         = 28

sp_pp_concat         = ignore   # Don't add spaces around '##' in macros

align_var_def_colon = false

indent_braces         = false
pp_indent             = ignore
sp_func_call_paren    = ignore

indent_paren_open_brace = true
align_struct_init_span = 0
